name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

  deploy-production:
    name: Deploy to Vercel
    needs: checks

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel secrets
        run: |
          test -n "$VERCEL_ORG_ID" || {
            echo "Missing VERCEL_ORG_ID secret"
            exit 1
          }

          test -n "$VERCEL_PROJECT_ID" || {
            echo "Missing VERCEL_PROJECT_ID secret"
            exit 1
          }

          test -n "$VERCEL_TOKEN" || {
            echo "Missing VERCEL_TOKEN secret"
            exit 1
          }

      - name: Pull production environment
        run: |
          npx vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build for production
        run: |
          npx vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: |
          npx vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
