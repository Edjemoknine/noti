<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.n{transform-box:fill-box;transform-origin:50% 50%;animation:n 3s cubic-bezier(.45,0,.35,1) infinite}
.p{fill:#0d0f0e;opacity:0;animation:p 3s ease-in-out infinite}
@keyframes n{
0%,12%{transform:scale(1,1);opacity:1}
26%{transform:translateY(-3px) scale(.84,1.22)}
40%{transform:translateY(8px) scale(.66,1.5);opacity:1}
46%{transform:translateY(14px) scale(.5,.55);opacity:0}
74%{transform:scale(.5);opacity:0}
84%{transform:scale(1.14);opacity:1}
92%,100%{transform:scale(1,1);opacity:1}}
@keyframes p{
0%,43%{opacity:0;transform:translate(0,0)}
45%{opacity:1;transform:translate(0,0)}
60%{opacity:1;transform:translate(var(--dx),var(--dy))}
66%{opacity:1;transform:translate(var(--dx),var(--dy))}
80%{opacity:1;transform:translate(0,0)}
84%,100%{opacity:0;transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.n,.p{animation:none}.p{opacity:0}}
</style>
