name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database environment
        run: |
          node <<'NODE'
          const url = process.env.DATABASE_URL;

          if (!url) {
            console.error("DATABASE_URL is missing");
            process.exit(1);
          }

          try {
            const parsed = new URL(url);

            console.log("DATABASE_URL protocol:", parsed.protocol);
            console.log("DATABASE_URL host:", parsed.host);
            console.log("DATABASE_URL is valid");
          } catch {
            console.error("DATABASE_URL is not a valid URL");
            process.exit(1);
          }
          NODE

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

  deploy-production:
    name: Deploy to Vercel
    needs: checks

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel secrets
        run: |
          test -n "$VERCEL_ORG_ID" || {
            echo "Missing VERCEL_ORG_ID secret"
            exit 1
          }

          test -n "$VERCEL_PROJECT_ID" || {
            echo "Missing VERCEL_PROJECT_ID secret"
            exit 1
          }

          test -n "$VERCEL_TOKEN" || {
            echo "Missing VERCEL_TOKEN secret"
            exit 1
          }

      - name: Pull production environment
        run: |
          npx vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Validate pulled Vercel database URL
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = ".vercel/.env.production.local";

          if (!fs.existsSync(file)) {
            console.error(`${file} does not exist`);
            process.exit(1);
          }

          const content = fs.readFileSync(file, "utf8");

          const line = content
            .split("\n")
            .find((line) => line.startsWith("DATABASE_URL="));

          if (!line) {
            console.error(
              "DATABASE_URL was not found in Vercel production environment"
            );
            process.exit(1);
          }

          let value = line.slice("DATABASE_URL=".length).trim();

          // Remove surrounding quotes if present.
          value = value.replace(/^['"]|['"]$/g, "");

          console.log("DATABASE_URL found");
          console.log("Length:", value.length);

          try {
            const url = new URL(value);

            console.log("Protocol:", url.protocol);
            console.log("Host:", url.host);
            console.log("Pathname:", url.pathname);
            console.log("Valid URL: yes");
          } catch {
            console.error(
              "Vercel DATABASE_URL is NOT a valid URL"
            );
            process.exit(1);
          }
          NODE

      - name: Build for production
        run: |
          npx vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: |
          npx vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
